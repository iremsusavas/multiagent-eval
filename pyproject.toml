[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-eval"
version = "0.1.0"
description = "Open Source Multi-Agent System Evaluation Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "İrem Suşavaş", email = "iremsu@proton.me"}
]
keywords = ["multi-agent", "llm-evaluation", "agent-tracing", "langgraph", "crewai", "propagation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "jinja2>=3.1",
    "structlog>=23.0",
]

[project.optional-dependencies]
# Semantic similarity for error_propagation_score and inter_agent_consistency
# WARNING: pulls PyTorch (~1 GB). Use only when embedding-level precision is required.
# Without this, multiagent-eval uses built-in TF-IDF cosine similarity (no dependencies).
semantic = [
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]

# Streamlit-based evaluation dashboard
dashboard = [
    "streamlit>=1.28",
    "networkx>=3.0",
    "pyvis>=0.3",
    "matplotlib>=3.7",
]

# OpenTelemetry tracing (Datadog, Grafana, Jaeger)
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]

# Database persistence
postgres = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

# Install everything
all = [
    "multiagent-eval[semantic,dashboard,otel]",
]

# Development
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[project.scripts]
multiagent-eval = "multiagent_eval.cli:app"

[project.urls]
Homepage = "https://github.com/iremsusavas/multiagent-eval"
Repository = "https://github.com/iremsusavas/multiagent-eval"
Documentation = "https://github.com/iremsusavas/multiagent-eval#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=multiagent_eval --cov-report=term-missing --cov-fail-under=27"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
