# Free / low-cost models example config

pipeline:
  name: "my_research_pipeline"
  adapter: "langgraph"

evaluation:
  golden_dataset: "datasets/research_qa.json"
  metrics:
    - factual_accuracy
    - inter_agent_consistency
    - error_propagation_score
    - cascade_failure_detection
  thresholds:
    factual_accuracy: 0.8
    inter_agent_consistency: 0.75

judge:
  # Free options:
  # 1. Ollama (local): ollama run mistral
  # 2. Groq: groq/llama-3.1-70b-versatile (GROQ_API_KEY)
  # 3. Mistral API: mistral/mistral-small-latest (MISTRAL_API_KEY)
  # 4. Together: together_ai/mistralai/Mixtral-8x7B-Instruct-v0.1
  primary_model: "ollama/mistral"
  fallback_model: "ollama/llama3.2"
  bias_detection: true
  cot_prompting: true

reporting:
  output_dir: "eval_results/"
  formats: ["json", "html"]
  dashboard: true
